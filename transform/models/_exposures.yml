version: 2

exposures:
  - name: housing_radar_app
    label: Spanish Housing Radar (Streamlit)
    type: dashboard
    maturity: medium
    url: https://spanish-housing-radar-carlosdmv7.streamlit.app
    description: >
      Public Streamlit app: opportunity search (scored listings + map), market
      benchmarks per neighbourhood, mortgage simulator and affordability index.
      Anything these models expose is part of the app's de-facto API — see the
      enforced contract on rpt_opportunities.
    # Every model app/ actually queries, verified by grepping the app for
    # main_gold.* and main_silver.* rather than from memory. It listed four while
    # the app read eight, so the published lineage graph understated the blast
    # radius of a change to the other four — which is the one thing an exposure
    # exists to prevent.
    depends_on:
      - ref('rpt_opportunities')          # Overview + Deals: the contracted view
      - ref('fct_listings_scored')        # freshness strip + grain distribution
      - ref('rpt_market_context')         # Neighbourhoods: latest INE quarter
      - ref('rpt_market_trend')           # Neighbourhoods: INE series
      - ref('rpt_district_affordability') # Value check: income denominators
      - ref('int_neighborhood_stats')     # Neighbourhoods: €/m² benchmarks
      - ref('int_listings_current')       # freshness strip, city filters
      - ref('int_listings_screened')      # How it works: listings set aside
      - ref('ccaa_by_municipality')       # seed bridging municipality → CCAA
    owner:
      name: Carlos DMV
      email: carlosdmv7@gmail.com
