version: 2

sources:
  - name: raw
    database: spanish_housing_radar
    schema: raw
    description: >
      Append-only raw tables written by the extraction pipeline.
      Never modified after insert — every scraping run adds new rows.

    # Default freshness is overridden per table below. See ADR-0003 and the
    # README's "scraping is paused" note for why idealista stays warn-only while
    # ine_hpi fails the build when stale.
    loaded_at_field: _loaded_at

    tables:
      - name: idealista_listings
        description: >
          Raw listings scraped from idealista.com, one row per listing per run.
          **Note:** scraping is paused (Scrapfly credits). This table will not
          update until credits return. The freshness threshold is warn-only so CI
          stays green; the freshness header shows "paused" to be transparent.
        freshness:
          warn_after: {count: 30, period: day}
          # No error_after; we knowingly let this table age without failing the build.
        columns:
          - name: source_id
            description: Idealista's internal listing ID (e.g. 109947740).
            tests: [not_null]
          - name: _run_id
            description: Identifier of the extraction run that produced this row.
            tests: [not_null]
          - name: raw_price_eur
            tests:
              - not_null
              - dbt_utils.accepted_range:
                  min_value: 1
                  max_value: 50000000

      - name: fotocasa_listings
        description: >
          Raw Fotocasa listings. Scraper is ready but this table is not ingested
          yet, so freshness is not enforced. Re-add thresholds once data lands.
        freshness:
          warn_after: ~
        columns:
          - name: source_id
          - name: _run_id

      - name: ine_hpi
        description: >
          Official INE house-price index (IPV) by autonomous community, quarterly
          (base 2015=100). Free Tempus3 API feed — grounds scraped asking prices
          against transaction-based reality. One row per series × quarter.
          **This feed is actively maintained.** Freshness failures on this table
          will fail the build — a broken CI gate that catches a stalled pipeline.
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 10, period: day}
        columns:
          - name: series_cod
            tests: [not_null]
          - name: region
            tests: [not_null]
          - name: metric
            tests:
              - not_null
              - accepted_values:
                  values: [index, qoq, yoy, ytd]
          - name: value
            tests: [not_null]
      - name: ine_income
        description: >
          District-level household income from INE's Atlas de Distribución de
          Renta de los Hogares (ADRH, table 30824). One row per district ×
          metric × year, 2015 onwards. This is the denominator the opportunity
          score never had: a barrio can be cheap because it is a bargain or
          because nobody there can afford more, and €/m² alone cannot tell those
          apart.

          **Annual, not daily.** INE publishes one reference year at a time with
          roughly a two-year lag, so freshness is measured in months and this
          table is deliberately exempt from the pipeline's staleness gate — a
          warn at 400 days catches a feed that has genuinely stopped, without
          turning a normal publication gap into a red build.
        freshness:
          warn_after: {count: 400, period: day}
        columns:
          - name: district_code
            description: 7-digit INE district code, e.g. 4625001 for Ciutat Vella.
            tests: [not_null]
          - name: municipality_code
            tests: [not_null]
          - name: metric
            tests:
              - not_null
              - accepted_values:
                  values:
                    - net_income_per_person
                    - net_income_per_household
                    - gross_income_per_person
                    - gross_income_per_household
                    - mean_income_per_consumption_unit
                    - median_income_per_consumption_unit
          - name: year
            tests: [not_null]
          - name: value
            description: Euros. Never zero — a suppressed cell is dropped at extraction.
            tests:
              - not_null
              - dbt_utils.accepted_range:
                  min_value: 1
                  max_value: 500000
