version: 2

models:
  - name: stg_idealista__listings
    description: >
      Cleaned and typed snapshot of every Idealista listing per run.
      Grain: one row per (source_id, _run_id).
      Adds snapshot_pk, listing_pk, and DQ flags.
    columns:
      - name: snapshot_pk
        description: "Surrogate PK: source_name__source_id__run_id. Globally unique."
        tests: [unique, not_null]
      - name: listing_pk
        description: "Stable listing identifier across runs: source_name__source_id."
        tests: [not_null]
      - name: operation_type
        tests:
          - accepted_values:
              values: [sale, rent]
      - name: dq_bad_price
        tests: [not_null]
      - name: dq_bad_size
        tests: [not_null]

      # ── Card attributes (ADR-0012) ──────────────────────────────────────────
      # As the advertiser states them on the search card. NULL means the card
      # did not say it — never "no" — and is the value of every snapshot
      # loaded before these were scraped. Read through column_or_null, so the
      # model builds whether or not raw.idealista_listings has them yet.
      - name: floor
        description: >
          Storey as an integer: sótano / semi-sótano -1, bajo and entreplanta 0,
          "Planta Nª" N. NULL when the card states no floor (houses, chalets).
          floor_text keeps the span it was read from.
        tests:
          - dbt_utils.accepted_range:
              min_value: -3
              max_value: 60
      - name: floor_text
        description: The card's floor span verbatim, e.g. "Planta 3ª exterior con ascensor".
      - name: is_exterior
        description: True when the card says "exterior", false for "interior", NULL when unstated.
      - name: has_lift
        description: True for "con ascensor", false for "sin ascensor", NULL when unstated.
      - name: garage
        description: >
          'included' — a garage space is in the asking price ("Garaje incluido");
          'optional' — one is offered separately and is NOT in the asking price
          ("Garaje opc. 60.000 €"). NULL when the card mentions no garage.
        tests:
          - accepted_values:
              values: [included, optional]
      - name: garage_price_eur
        description: Price of an optional garage when the card states it.
        tests:
          - dbt_utils.expression_is_true:
              expression: "is null or garage = 'optional'"
      - name: garage_text
        description: The card's garage span verbatim.
      - name: portal_previous_price_eur
        description: >
          The previous asking price the portal shows struck through on the card
          (its own price-drop marker) — not derived from our snapshot history,
          and possibly older than our first observation of the listing.
        tests:
          - dbt_utils.expression_is_true:
              expression: "is null or portal_previous_price_eur > price_eur"
              config:
                severity: warn
      - name: portal_price_drop_pct
        description: The cut as the portal states it, in percent (rounded by the portal).
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: false
      - name: description
        description: The card's description snippet (Idealista cuts it near 550 characters).
      - name: tags
        description: The card's listing tags, '|'-delimited, e.g. "Lujo|Villa".

  - name: stg_fotocasa__listings
    description: >
      Cleaned and typed snapshot of every Fotocasa listing per run.
      Grain and columns identical to stg_idealista__listings.
    columns:
      - name: snapshot_pk
        tests: [unique, not_null]
      - name: listing_pk
        tests: [not_null]
      - name: operation_type
        tests:
          - accepted_values:
              values: [sale, rent]

  - name: stg_ine__hpi
    description: >
      Light typing over the raw INE house-price index (IPV) feed: region and
      metric lowercased, period cast to a date. Keeps every series × quarter
      observation; silver picks the grains and metrics it needs.
      Grain: one row per (series_cod, period_date).

      The IPV is a *regional* index, base 2025 = 100, published quarterly and in
      arrears. It is the transaction-based counterweight to the scraped asking
      prices, and it is never a per-flat valuation — the finest grain it has is
      the autonomous community.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [series_cod, period_date]
    columns:
      - name: series_cod
        description: INE's own series identifier, e.g. the code behind "Comunitat Valenciana. General. Índice.".
        tests: [not_null]
      - name: region
        description: Autonomous community, lowercased to the exact INE label. Includes "nacional".
        tests: [not_null]
      - name: housing_type
        tests:
          - not_null
          - accepted_values:
              values: [general, new, second_hand]
      - name: metric
        description: index (level, 2025=100), yoy / qoq / ytd (percentage changes).
        tests:
          - not_null
          - accepted_values:
              values: [index, qoq, yoy, ytd]
      - name: period_date
        description: >
          Last day of the quarter the observation describes — NOT when it was
          loaded. This is the column that says whether the data is current;
          `_loaded_at` only says whether the loader ran. See
          tests/assert_ine_hpi_period_is_current.sql.
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: stg_ine__income
    description: >
      Light typing over INE's Atlas de Distribución de Renta de los Hogares
      (ADRH, table 30824): municipality and district names lowercased and
      trimmed. Keeps every district × metric × year; silver picks the reference
      year.
      Grain: one row per (district_code, metric, year).

      District names arrive as INE numbers them ("València distrito 01"), which
      is not how listings name them — the `ine_districts` seed carries that
      mapping and int_district_income performs the join.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [district_code, metric, year]
    columns:
      - name: district_code
        description: 7-digit INE district code, e.g. 4625001 for València Ciutat Vella.
        tests: [not_null]
      - name: municipality_code
        tests: [not_null]
      - name: metric
        tests:
          - not_null
          - accepted_values:
              values:
                - net_income_per_person
                - net_income_per_household
                - gross_income_per_person
                - gross_income_per_household
                - mean_income_per_consumption_unit
                - median_income_per_consumption_unit
      - name: year
        description: Reference year of the figure, not its publication year — ADRH lags ~2 years.
        tests: [not_null]
      - name: value
        description: Euros. A suppressed cell is dropped at extraction, never zero-filled.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 500000
