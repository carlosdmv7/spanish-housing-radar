version: 2

models:
  - name: int_listings_unioned
    description: >
      The multi-source spine: bronze staging unioned, DQ-filtered, property-type
      normalised, barrios cleaned and geocoded, with cross-source dedup.
      Grain: one row per snapshot_pk. Single entry point for downstream silver.
    columns:
      - name: snapshot_pk
        tests: [unique, not_null]
      - name: listing_pk
        tests: [not_null]
      - name: operation_type
        tests:
          - not_null
          - accepted_values:
              values: [sale, rent]
      - name: property_type
        tests:
          - accepted_values:
              values: [apartment, house, other]
      - name: neighborhood_is_canonical
        description: >
          True when the barrios_es seed confirms this name is a real barrio.
          False means unconfirmed, NOT disproven — the seed covers Madrid,
          València, Barcelona, Málaga and Sevilla and knows nothing of Bilbao,
          Valladolid or Zaragoza. Use it for displayed confidence, never as a
          benchmark gate; `neighborhood_is_benchmarkable` is the gate.
        tests: [not_null]
      - name: neighborhood_is_benchmarkable
        description: >
          True when this name may form a barrio-grain benchmark: either the seed
          confirmed it, or the seed does not cover this city and the name
          survived the `is_not_an_area` scrub. Strictly weaker than
          `_is_canonical`, so a gap in reference data cannot disqualify a real
          barrio.
        tests: [not_null]
      - name: price_per_sqm
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 50000

  - name: int_listings_current
    description: >
      Latest valid snapshot per listing (current state).
      Grain: one row per listing_pk.
      Use this for pricing analysis, scoring, and maps.
    columns:
      - name: listing_pk
        tests: [unique, not_null]
      - name: municipality
        tests: [not_null]
      - name: price_eur
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: property_type
        tests:
          - accepted_values:
              values: [apartment, house, other]

  - name: int_listings_history
    description: >
      All valid snapshots per listing across time.
      Grain: one row per snapshot_pk.
      Use this for price evolution and trend analysis.
    columns:
      - name: snapshot_pk
        tests: [unique, not_null]

  - name: int_listing_lifecycle
    description: >
      Behavioural signals per listing, derived from the snapshot history:
      days-on-market, number of price changes and cumulative price change %.
      Grain: one row per listing_pk. A stronger "negotiable deal" signal than
      static €/m² cheapness; thin until several snapshots accumulate per listing.
    columns:
      - name: listing_pk
        tests: [unique, not_null]
      - name: n_snapshots
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
      - name: days_on_market
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: n_price_changes
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: price_dropped
        tests: [not_null]

  - name: int_neighborhood_stats
    description: >
      Pre-aggregated price benchmarks by neighborhood × operation × property_type.
      Grain: one row per (municipality, neighborhood, operation_type, property_type).
    tests:
      # Guards the grain — a duplicate here fans out fct_listings_scored and
      # silently duplicates listings (regression caught 2026-06).
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - municipality
            - neighborhood
            - operation_type
            - property_type
    columns:
      - name: total_listings
        tests:
          - dbt_utils.accepted_range:
              min_value: 1

  - name: int_market_context
    description: >
      Latest-quarter INE house-price index per region × housing_type, with index
      level, YoY and QoQ variation pivoted into columns. The official market
      reality shown alongside scraped asking prices.
      Grain: one row per (region, housing_type).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region, housing_type]
    columns:
      - name: region
        tests: [not_null]
      - name: housing_type
        tests:
          - not_null
          - accepted_values:
              values: [general, new, second_hand]
      - name: hpi_index
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: dim_neighborhoods
    description: >
      Master list of neighborhoods observed in the data, with centroid coordinates
      (from scraped lat/lon or the Valencia barrio seed).
      Grain: one row per (municipality, neighborhood).
    columns:
      - name: neighborhood_pk
        tests: [unique, not_null]
      # Catch a mis-geocoded centroid (e.g. a pin dropped in the sea). Spain's
      # mainland bounding box; nulls (un-geocoded barrios) are ignored.
      - name: centroid_lat
        tests:
          - dbt_utils.accepted_range:
              min_value: 35
              max_value: 44
      - name: centroid_lon
        tests:
          - dbt_utils.accepted_range:
              min_value: -10
              max_value: 5

  - name: int_district_income
    description: >
      The latest published household income per district, joined to the district
      names this app actually uses.
      Grain: one row per (municipality, district) — equivalently one per
      district_code, since only the most recent ADRH year is kept.

      This is the denominator the opportunity score never had. Every other figure
      in this warehouse compares a flat to other flats, which answers "is this
      cheap for the area?" and cannot answer "is this area cheap?" — a barrio can
      be inexpensive because it is a bargain or because nobody in it can pay more.
      See ADR-0008.

      **Coverage is València only, 19 districts.** The join runs through the
      `ine_districts` seed, which is sourced from the Ajuntament's own published
      district list; no other city has one yet, so every other municipality is
      absent here rather than wrong. Inferring the mapping from the data would
      mean deciding which barrio sits in which district using the very prices the
      income is about to divide.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipality, district]
    columns:
      - name: district_code
        tests: [unique, not_null]
      - name: municipality
        tests: [not_null]
      - name: district
        description: District name as listings spell it, via the ine_districts seed.
        tests: [not_null]
      - name: reference_year
        description: >
          The year the income describes, exposed deliberately so the app can
          state it rather than let a ~2-year-old figure read as current.
        tests: [not_null]
      - name: net_income_per_person
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, max_value: 200000}
      - name: net_income_per_household
        description: The denominator rpt_district_affordability divides asking prices by.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, max_value: 500000}
      - name: median_income_per_consumption_unit
        tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 500000}
