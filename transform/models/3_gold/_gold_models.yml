version: 2

models:
  - name: fct_listings_scored
    description: >
      Final fact table combining current listings with hierarchical price
      benchmarks (neighbourhood → district → city) and opportunity scoring.
      Grain: one row per listing_pk. Primary consumption layer for Streamlit/BI.
    columns:
      - name: listing_pk
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('int_listings_current')
              field: listing_pk
      - name: operation_type
        tests:
          - not_null
          - accepted_values:
              values: [sale, rent]
      - name: opportunity_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: deal_tier
        tests:
          - not_null
          - accepted_values:
              values: [great_deal, good_deal, fair, overpriced, very_overpriced]
      - name: benchmark_level
        description: Which grain actually scored the listing once the comparable threshold was applied.
        tests:
          - not_null
          - accepted_values:
              values: [neighbourhood, district, city]
      - name: benchmark_comp_count
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
      - name: low_confidence_flag
        tests: [not_null]
      - name: ppsqm_z_score
        tests:
          - dbt_utils.accepted_range:
              min_value: -3
              max_value: 3

  - name: rpt_market_context
    description: >
      Official INE house-price index resolved to each served municipality (via the
      ccaa_by_municipality bridge). One row per municipality; the app reads it to
      show official market direction next to asking-price benchmarks.
    columns:
      - name: municipality
        tests: [unique, not_null]

  - name: rpt_opportunities
    description: >
      Reporting view over fct_listings_scored — the table the Streamlit app reads.
      Same grain (one row per listing_pk); low-confidence rows are surfaced (not
      hidden) so the UI can flag them rather than silently dropping listings.
      The enforced contract freezes the schema the app depends on: renaming or
      retyping a column here fails the build instead of breaking the live app.
    config:
      contract:
        enforced: true
    columns:
      - name: listing_pk
        data_type: varchar
        tests: [unique, not_null]
      - name: source_name
        data_type: varchar
      - name: url
        data_type: varchar
      - name: municipality
        data_type: varchar
      - name: district
        data_type: varchar
      - name: neighborhood
        data_type: varchar
      - name: neighborhood_is_canonical
        data_type: boolean
      - name: operation_type
        data_type: varchar
      - name: property_type
        data_type: varchar
      - name: price_eur
        data_type: double
      - name: size_sqm
        data_type: double
      - name: rooms
        data_type: integer
      - name: price_per_sqm
        data_type: double
      - name: neighborhood_median_ppsqm
        data_type: double
      - name: ppsqm_vs_median
        data_type: double
      - name: ppsqm_z_score
        data_type: double
      - name: opportunity_score
        data_type: double
      - name: deal_tier
        data_type: varchar
      - name: benchmark_level
        data_type: varchar
        tests:
          - accepted_values:
              values: [neighbourhood, district, city]
      - name: benchmark_comp_count
        data_type: bigint
      - name: low_confidence_flag
        data_type: boolean
      - name: first_seen_date
        data_type: date
        description: First date this listing was ever observed (from snapshot history).
      - name: days_on_market
        data_type: bigint
        description: Days between first and last observation — a behavioural deal signal.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: n_price_changes
        data_type: bigint
        description: Number of price movements observed across snapshots.
      - name: price_change_pct
        data_type: double
        description: Cumulative % change between the first and latest observed price.
      - name: price_dropped
        data_type: boolean
        description: True if the latest price is below the first observed price.
      - name: seller_motivation
        data_type: varchar
        description: Composite low/medium/high signal from days-on-market + price cuts.
        tests:
          - not_null
          - accepted_values:
              values: [low, medium, high]
      - name: lat
        data_type: double
      - name: lon
        data_type: double
      - name: _loaded_at
        data_type: timestamp with time zone

  - name: rpt_district_affordability
    description: >
      Asking prices divided by what the people who live there actually earn.
      Grain: one row per (municipality, district, operation_type, property_type).

      Every other figure in this warehouse compares a flat to other flats, which
      answers "is this cheap for the area?" and cannot answer "is this area
      cheap?". District household income from INE's ADRH is the missing
      denominator, and unlike a listing it does not disappear when the advert
      comes down. See ADR-0008.

      Districts and not barrios on purpose: ADRH's finer grain is the census
      section, which is finer than anything this app can join to, so the district
      is the honest floor. Income is joined LEFT — a district with no INE figure
      keeps its price rows and gets a null ratio, rather than vanishing and
      making coverage look better than it is.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipality, district, operation_type, property_type]
    columns:
      - name: municipality
        tests: [not_null]
      - name: district
        tests: [not_null]
      - name: operation_type
        tests:
          - not_null
          - accepted_values:
              values: [sale, rent]
      - name: property_type
        tests:
          - not_null
          - accepted_values:
              values: [apartment, house, other]
      - name: listings
        description: >
          How many listings the medians on this row are computed from. Load-
          bearing, not decorative: it is what makes low_sample_flag meaningful
          and it is shown in the app beside every figure it qualifies.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: low_sample_flag
        description: >
          True when this row rests on fewer than `min_listings_for_area_stat`
          listings, i.e. when the median describes a handful of flats rather than
          a district. The row is kept and shown anyway (ADR-0005); this flag is
          what obliges every surface to say so, exactly as benchmark_level does
          for an opportunity score.
        tests: [not_null]
      - name: median_price_eur
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: median_ppsqm
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
      - name: income_reference_year
        description: >
          The year the income figure describes, not its publication year. ADRH
          lags roughly two years, so this row mixes today's asking prices with a
          two-year-old income and reads as a direction, never a precise multiple.
          Null where no income was joined.
      - name: net_income_per_household
        description: The denominator of both ratios below. Null outside València.
      - name: years_of_household_income
        description: >
          Median asking price ÷ median net household income, sale rows only.
          Deliberately gross and deliberately unfinanced — the moment a mortgage
          rate enters, the number stops describing the district and starts
          describing the borrower.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 200
      - name: rent_pct_of_household_income
        description: >
          Share of median net household income the median asking rent consumes,
          rent rows only. Above 30% is the Eurostat/INE housing-cost overburden
          threshold. These are asking rents for flats on the market today against
          the income of everyone already living there, most of whom are not
          moving — it measures the gap between market and residents, not what
          households actually pay.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 500
