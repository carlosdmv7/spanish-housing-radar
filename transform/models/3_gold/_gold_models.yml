version: 2

models:
  - name: fct_listings_scored
    description: >
      Final fact table combining current listings with hierarchical price
      benchmarks (neighbourhood → district → city) and opportunity scoring.
      Grain: one row per listing_pk. Primary consumption layer for Streamlit/BI.
    columns:
      - name: listing_pk
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('int_listings_current')
              field: listing_pk
      - name: operation_type
        tests:
          - not_null
          - accepted_values:
              values: [sale, rent]
      - name: opportunity_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: deal_tier
        tests:
          - not_null
          - accepted_values:
              values: [great_deal, good_deal, fair, overpriced, very_overpriced]
      - name: benchmark_level
        description: Which grain actually scored the listing once the comparable threshold was applied.
        tests:
          - not_null
          - accepted_values:
              values: [neighbourhood, district, city]
      - name: benchmark_comp_count
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
      - name: low_confidence_flag
        tests: [not_null]
      - name: ppsqm_z_score
        tests:
          - dbt_utils.accepted_range:
              min_value: -3
              max_value: 3

  - name: rpt_market_context
    description: >
      Official INE house-price index resolved to each served municipality (via the
      ccaa_by_municipality bridge). One row per municipality; the app reads it to
      show official market direction next to asking-price benchmarks.
    columns:
      - name: municipality
        tests: [unique, not_null]

  - name: rpt_opportunities
    description: >
      Reporting view over fct_listings_scored — the table the Streamlit app reads.
      Same grain (one row per listing_pk); low-confidence rows are surfaced (not
      hidden) so the UI can flag them rather than silently dropping listings.
      The enforced contract freezes the schema the app depends on: renaming or
      retyping a column here fails the build instead of breaking the live app.
    config:
      contract:
        enforced: true
    columns:
      - name: listing_pk
        data_type: varchar
        tests: [unique, not_null]
      - name: source_name
        data_type: varchar
      - name: url
        data_type: varchar
      - name: municipality
        data_type: varchar
      - name: district
        data_type: varchar
      - name: neighborhood
        data_type: varchar
      - name: neighborhood_is_canonical
        data_type: boolean
      - name: operation_type
        data_type: varchar
      - name: property_type
        data_type: varchar
      - name: price_eur
        data_type: double
      - name: size_sqm
        data_type: double
      - name: rooms
        data_type: integer
      - name: price_per_sqm
        data_type: double
      - name: neighborhood_median_ppsqm
        data_type: double
      - name: ppsqm_vs_median
        data_type: double
      - name: ppsqm_z_score
        data_type: double
      - name: opportunity_score
        data_type: double
      - name: deal_tier
        data_type: varchar
      - name: benchmark_level
        data_type: varchar
        tests:
          - accepted_values:
              values: [neighbourhood, district, city]
      - name: benchmark_comp_count
        data_type: bigint
      - name: low_confidence_flag
        data_type: boolean
      - name: first_seen_date
        data_type: date
        description: First date this listing was ever observed (from snapshot history).
      - name: days_on_market
        data_type: bigint
        description: Days between first and last observation — a behavioural deal signal.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: n_price_changes
        data_type: bigint
        description: Number of price movements observed across snapshots.
      - name: price_change_pct
        data_type: double
        description: Cumulative % change between the first and latest observed price.
      - name: price_dropped
        data_type: boolean
        description: True if the latest price is below the first observed price.
      - name: seller_motivation
        data_type: varchar
        description: Composite low/medium/high signal from days-on-market + price cuts.
        tests:
          - not_null
          - accepted_values:
              values: [low, medium, high]
      - name: lat
        data_type: double
      - name: lon
        data_type: double
      - name: _loaded_at
        data_type: timestamp with time zone
