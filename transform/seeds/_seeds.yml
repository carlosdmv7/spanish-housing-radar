version: 2

seeds:
  - name: barrios_es
    description: >
      Canonical barrio names + approximate centroids for Valencia, Madrid,
      Barcelona, Sevilla and Málaga. `alias` is the exact lowercased string the
      scraper produces; `neighborhood`/`district` are the canonical names it
      collapses to. Joined in int_listings_unioned to clean the neighbourhood
      grain and geocode listings without coordinates.
    tests:
      # The unioned model joins on (municipality, alias) — a duplicate here
      # would fan out listings and break snapshot_pk uniqueness downstream.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipality, alias]
    columns:
      - name: alias
        tests: [not_null]
      - name: municipality
        tests: [not_null]
      - name: neighborhood
        tests: [not_null]
      - name: lat
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 35, max_value: 44}
      - name: lon
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: -10, max_value: 5}

  - name: ccaa_by_municipality
    description: >
      Maps each scraped municipality to its autonomous community, using the exact
      (lowercased) INE region label. Bridges the grain gap between barrio-level
      listings and CCAA-level INE house-price index in int_market_context.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipality]
    columns:
      - name: municipality
        tests: [not_null, unique]
      - name: ine_region
        tests: [not_null]

  - name: ine_districts
    description: >
      Maps INE's numeric district codes to the district names this app uses.
      INE identifies a district as "València distrito 01"; a listing calls it
      "ciutat vella", and nothing in either dataset connects the two.

      Sourced from the Ajuntament de València's own published list of the 19
      districts, NOT inferred from the listings. Inferring it would mean deciding
      which barrio sits in which district using the very prices the join exists
      to divide by income — circular, and impossible to check.

      Currently València only. Other cities need their own official district
      lists before they can be added; a guessed row here silently corrupts every
      affordability figure downstream.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ine_district_code]
    columns:
      - name: ine_district_code
        description: 7-digit INE code — 5-digit municipality plus 2-digit district.
        tests: [not_null, unique]
      - name: municipality
        tests: [not_null]
      - name: district
        description: The name as it appears in int_listings_current.district.
        tests: [not_null]
