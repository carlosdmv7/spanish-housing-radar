name: 'spanish_housing_radar'
version: '1.0.0'
config-version: 2

profile: 'spanish_housing_radar'

model-paths:  ["models"]
macro-paths:  ["macros"]
test-paths:   ["tests"]
seed-paths:   ["seeds"]
target-path:  "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Increment this on each run — used as _run_id in Bronze models
  run_id: "manual"
  # A benchmark grain needs at least this many comparable listings to be trusted.
  # Below it, the opportunity score falls back to the next-coarser grain
  # (neighbourhood → district → city) instead of comparing a flat to itself.
  min_comps_for_benchmark: 8
  # The same question asked of an area statistic rather than of a score: how many
  # listings a district or barrio median must rest on before it describes the area
  # instead of describing one flat. Deliberately the same number as
  # min_comps_for_benchmark — it is the same judgement — but a separate var,
  # because one is a scoring gate and the other is a disclosure threshold, and
  # tying them together would hide that they can reasonably diverge.
  min_listings_for_area_stat: 8
  # How far behind `current_date` the newest INE IPV quarter may fall before
  # assert_ine_hpi_period_is_current warns. The index is quarterly and published
  # about a quarter in arrears, so ~160 days back is normal just before a
  # release; this clears that without clearing a feed that has actually stopped.
  max_ine_period_lag_days: 200
  # int_listings_screened sets a listing aside when its €/m² is under a quarter
  # of, or over four times, the median of its city and operation — a typo in the
  # price or the size, not a flat (ADR-0009).
  max_ppsqm_ratio_to_city: 4
  # ...and when the scraper has not seen it for this many days before the city's
  # latest scrape: most likely sold or withdrawn.
  max_listing_age_days: 60

seeds:
  spanish_housing_radar:
    +schema: silver
    barrios_es:
      +column_types:
        lat: double
        lon: double

models:
  spanish_housing_radar:
    1_bronze:
      +schema: bronze
      +materialized: incremental
      +tags: ["bronze"]
    2_silver:
      +schema: silver
      +materialized: table
      +tags: ["silver"]
    3_gold:
      +schema: gold
      +materialized: table
      +tags: ["gold"]
      rpt_opportunities:
        +materialized: view     # always fresh — points to scored fact table

# Ensure dbt uses schema prefixes (bronze_, silver_, gold_) in MotherDuck
# by overriding generate_schema_name in macros/generate_schema_name.sql
