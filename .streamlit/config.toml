# Streamlit config. The [theme] tables are generated from the shared brand
# (github.com/carlosdmv7/brand) — the same tokens as the portfolio's styles.css.
# Change a colour there, never here: `uv run brand sync streamlit` rewrites the
# block below, and CI fails when it drifts (`brand sync streamlit --check`).
#
# Hard rule of that design system: NO CSS injection anywhere in this app.

# >>> brand — generated by `brand sync streamlit`. Do not edit by hand.
# No CSS injection anywhere: everything here is a native theme key, so a
# Streamlit upgrade can change the DOM without silently breaking the look.
[theme]
base = "light"

# Same families and Google Fonts URLs as the portfolio.
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
baseFontWeight = 400

# Read off the portfolio's stylesheet, with h1 at the bottom of its display
# range: an app title sits above dense controls, not alone in a viewport.
# Not reachable natively: the portfolio's negative letter-spacing.
headingFontSizes = ["2.25rem", "1.6rem", "1.3rem", "1.1rem", "1rem", "0.875rem"]
headingFontWeights = [700, 700, 700, 600, 600, 600]

# Streamlit's default 2.25rem metric reads as a scoreboard on a page of six.
metricValueFontSize = "1.75rem"
metricValueFontWeight = 700

backgroundColor = "#FDFAF4"           # surface
secondaryBackgroundColor = "#F5EFE3"  # surface-2
textColor = "#274C56"                 # ink
borderColor = "#E4D9C4"               # border
linkColor = "#A8501F"                 # rust-700

# rust-700, NOT rust-500: Streamlit puts white labels on primaryColor fills,
# and white on rust-500 is 3.42:1 (fails AA). On rust-700 it is 5.48:1.
primaryColor = "#A8501F"

baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

# Streamlit's alert colours are red-amber-blue-green — the green→red scale
# this brand forbids. Remapped onto tokens; every text/background pair ≥ 4.5:1.
# st.error → rust tint. The palette has no red; rust-900 is its alarm ink.
redColor = "#A8501F"
redBackgroundColor = "#FBEADF"
redTextColor = "#6E2F10"            # 8.64:1
# st.warning → sand fill, ink on it. Sand is never text.
orangeColor = "#E7A84E"
orangeBackgroundColor = "#F6E2B3"
orangeTextColor = "#274C56"           # 7.30:1
yellowColor = "#E7A84E"
yellowBackgroundColor = "#F6E2B3"
yellowTextColor = "#274C56"
# st.info → a quiet neutral well, deliberately calmer than a verdict.
blueColor = "#274C56"
blueBackgroundColor = "#F5EFE3"
blueTextColor = "#274C56"             # 8.13:1
violetColor = "#274C56"
violetBackgroundColor = "#F5EFE3"
violetTextColor = "#274C56"
# st.success → teal tint.
greenColor = "#2E6B5E"
greenBackgroundColor = "#E4F0EC"
greenTextColor = "#2E6B5E"          # 5.32:1
grayColor = "#4E636D"
grayBackgroundColor = "#F5EFE3"
grayTextColor = "#4E636D"           # 5.51:1

# These reach Altair, Vega-Lite and Plotly alike, so a chart built without
# brand.altair still lands on-brand instead of on Streamlit blue.
chartCategoricalColors = ["#274C56", "#D96C2C", "#3E8E7E", "#E7A84E", "#5C7480"]
chartDivergingColors = ["#2E6B5E", "#7FB3A4", "#F6E2B3", "#E7A84E", "#D96C2C"]
chartSequentialColors = ["#F6E2B3", "#E7A84E", "#D96C2C", "#A8501F", "#6E2F10"]

dataframeHeaderBackgroundColor = "#F5EFE3"
dataframeBorderColor = "#E4D9C4"
codeBackgroundColor = "#F5EFE3"
codeTextColor = "#6E2F10"

[theme.sidebar]
backgroundColor = "#F5EFE3"
secondaryBackgroundColor = "#FDFAF4"
borderColor = "#E4D9C4"
textColor = "#274C56"
linkColor = "#A8501F"
primaryColor = "#A8501F"
codeBackgroundColor = "#FDFAF4"

# The brand is light-only. Pinning the dark variant to the same tokens renders
# warm paper whatever the visitor's system or Streamlit Cloud setting.
[theme.dark]
backgroundColor = "#FDFAF4"
secondaryBackgroundColor = "#F5EFE3"
textColor = "#274C56"
borderColor = "#E4D9C4"
linkColor = "#A8501F"
primaryColor = "#A8501F"
dataframeHeaderBackgroundColor = "#F5EFE3"
dataframeBorderColor = "#E4D9C4"
codeBackgroundColor = "#F5EFE3"
codeTextColor = "#6E2F10"
# <<< brand

[client]
# Streamlit's default toolbar puts a "Deploy" button in the top-right of every
# page, including the deployed one, where it is an invitation to deploy an app
# that is already deployed. "minimal" keeps the useful menu items (rerun, print,
# settings) and drops the developer chrome, so the first thing a visitor sees in
# the corner is not a button meant for its author.
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
