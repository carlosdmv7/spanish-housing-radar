# Streamlit app configuration (committed — no secrets here).
# Secrets (MOTHERDUCK_TOKEN, ...) go in .streamlit/secrets.toml (gitignored)
# or in the Streamlit Community Cloud "Secrets" UI.

[theme]
primaryColor = "#3b82f6"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b26"
textColor = "#e7ecf3"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
