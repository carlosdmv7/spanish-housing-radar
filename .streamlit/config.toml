# Streamlit theme — brand tokens, native keys only (survives version upgrades).
[theme]
base = "light"
primaryColor = "#D96C2C"
backgroundColor = "#FDFAF4"
secondaryBackgroundColor = "#F5EFE3"
textColor = "#274C56"
linkColor = "#A8501F"
borderColor = "#E4D9C4"
baseRadius = "0.6rem"
font = "sans-serif"

[server]
headless = true

[browser]
gatherUsageStats = false
