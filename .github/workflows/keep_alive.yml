name: Keep app awake

# Streamlit Community Cloud puts apps to sleep after a period without traffic,
# greeting visitors (recruiters!) with a wake-up screen instead of the app.
# This ping counts as traffic and keeps it warm. Costs nothing — no Scrapfly,
# no MotherDuck writes; it only loads the app's front page.
#
# Note: GitHub auto-disables scheduled workflows after ~60 days without repo
# activity — re-enable from the Actions tab if the repo goes quiet that long.
on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours (odd minute to dodge cron rush)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live app
        run: |
          # No -L: Streamlit Community Cloud bounces an anonymous client through
          # its auth gateway, which loops for a cookieless client and makes curl
          # exit 47 (too many redirects) — under `bash -e` that alone fails the
          # step. We only need to reach the app to keep it warm, so take the
          # first response code and don't follow redirects. `|| echo 000` guards
          # a transport failure so the pipe can't abort the step before the check.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            "https://spanish-housing-radar-carlosdmv7.streamlit.app/" || echo "000")
          echo "App responded with HTTP $code"
          # A 200 (OK) or the 303 auth-gateway redirect both mean the ping
          # reached the app and kept it awake. Only fail on a transport error
          # (000) or a 5xx, which signal the app is actually down.
          case "$code" in
            000|5*) echo "::error::App did not respond (HTTP $code)"; exit 1 ;;
            *)      echo "App is awake." ;;
          esac
