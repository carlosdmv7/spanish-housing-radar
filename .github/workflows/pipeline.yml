name: Pipeline

# Prefect Cloud holds the `spanish-housing-radar-daily/refresh` deployment: its
# schedule (Mondays 05:00 UTC), its parameters and its run history. This
# workflow lends it a machine. Every hour it registers the deployment from the
# code on main, asks Cloud whether a run is due — the scheduled one, or one
# started by hand from the Prefect UI — and if so runs it
# (orchestration/gha_runner.py). An idle hour exits in about a minute.
#
# The cadence lives in one place, gha_runner.SCHEDULE. The cron below is only
# how often the machine checks; it is not the schedule.
#
# Why this and not a Prefect work pool: the free tier has no hybrid pools, and
# its 500 serverless minutes a month are shared with job-market-intelligence,
# which alone needs ~300. Actions minutes on a public repo are free.
on:
  schedule:
    - cron: "13 * * * *"  # hourly, off the hour: shared cron slots are congested
  workflow_dispatch: {}   # run whatever is due now, e.g. right after a UI "Run"

concurrency:
  group: pipeline
  cancel-in-progress: false  # never kill a half-finished warehouse write

# The run pushes docs/status.json back to the default branch.
permissions:
  contents: write

jobs:
  run-pipeline:
    name: Prefect runner (one pass)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The flow prepares dbt itself (profile + deps), so a run needs nothing
      # else from this job. SCRAPE_* bound what one run may spend.
      - name: Run what Prefect has due
        id: serve
        run: uv run python -m orchestration.gha_runner
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          # Listing scrape runs only when this repo variable is 'true'. Until then
          # the run refreshes INE + dbt only.
          SCRAPFLY_ENABLED: ${{ vars.SCRAPFLY_ENABLED || 'false' }}
          # Scrapfly bills a flat 25 credits per search page, so the free monthly
          # allowance is 40 pages. These bound what one scheduled run may spend:
          # València, sale + rent, 4 pages each = 200 credits, roughly one weekly
          # run inside a 1 000-credit month with room for an ad-hoc scrape.
          SCRAPE_CITIES: ${{ vars.SCRAPE_CITIES || 'valencia' }}
          SCRAPE_OPERATIONS: ${{ vars.SCRAPE_OPERATIONS || 'sale,rent' }}
          IDEALISTA_MAX_SEARCH_PAGES: ${{ vars.IDEALISTA_MAX_SEARCH_PAGES || '4' }}
          IDEALISTA_MAX_LISTINGS: ${{ vars.IDEALISTA_MAX_LISTINGS || '150' }}
          # The scraper enforces this ceiling per *process*, and the flow starts one
          # process per operation — so this is 125 per operation, not 125 per run.
          # Two operations puts the hard stop at 250 for the whole run, above the
          # 200 the settings above should cost and below anything that would hurt.
          SCRAPFLY_CREDIT_BUDGET: ${{ vars.SCRAPFLY_CREDIT_BUDGET || '125' }}

      # if: always() is the point of this step. A run that dies mid-pipeline is
      # exactly the run whose status is worth recording — otherwise the only
      # evidence is a red tick in the Actions tab that nothing outside GitHub
      # can read, and docs/status.json silently keeps asserting the last good
      # run's numbers. Recording the failure is what stops the file from lying.
      # Only when a run happened, though: an idle hour has nothing to record.
      - name: Record pipeline status
        if: always() && steps.serve.outputs.ran == 'true'
        run: uv run python -m orchestration.status
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          # The runner's read of the flow run's final state. Missing means the
          # runner died mid-run — which is a failed run.
          RUN_CONCLUSION: ${{ steps.serve.outputs.conclusion || 'failure' }}

      - name: Commit pipeline status
        if: always() && steps.serve.outputs.ran == 'true'
        run: |
          set -euo pipefail

          # The step above is itself if: always(), so it can have failed before
          # writing anything (a broken `uv sync`, for instance). No file, nothing
          # to commit — and still not a reason to fail the job.
          if [ ! -f docs/status.json ]; then
            echo "docs/status.json was never written — nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/status.json

          # generated_at moves on every run, so committing unconditionally would
          # bury this file's history — the very thing it exists to provide —
          # under a weekly no-op commit. Commit only when a *substantive* field
          # changed: row counts, test counts, ingest date, run conclusion.
          substantive=$(git diff --cached -U0 -- docs/status.json \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -v '"generated_at"' || true)

          if [ -z "$substantive" ]; then
            echo "No substantive change since the last run — not committing."
            git restore --staged docs/status.json
            exit 0
          fi

          git commit -m "Pipeline: record run status [skip ci]"
          # A merge can land between checkout and here; rebase rather than let a
          # push race fail a run that already did its real work.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
