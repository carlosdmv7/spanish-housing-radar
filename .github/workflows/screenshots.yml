name: Capture screenshots

# Manual utility: boots the Streamlit app against MotherDuck on the runner,
# screenshots every page with Playwright, and commits the PNGs to the branch it
# was dispatched on (docs/img/). Used to refresh the README visuals — the local
# WSL dev box lacks the browser system libraries.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prune-cache: false because the post-job prune has failed this workflow
      # twice with `uv failed with exit code 2` *after* the screenshots were
      # captured and pushed successfully. A red tick on a job that did its work
      # is worse than a cold cache: it cost one wrong diagnosis already. This
      # workflow runs by hand a few times a year, so the cache saves seconds.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install playwright        # utility-only, not a project dependency
          uv run playwright install chromium --with-deps

      - name: Start Streamlit
        run: |
          nohup uv run streamlit run app/main.py \
            --server.headless true --server.port 8501 \
            --server.fileWatcherType none \
            > streamlit.log 2>&1 &
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

      - name: Capture pages
        run: uv run python scripts/capture_screenshots.py

      # The app runs backgrounded — if it dies mid-capture this is the only
      # place its stacktrace shows up.
      - name: Dump app log on failure
        if: failure()
        run: tail -100 streamlit.log || true

      - name: Commit screenshots to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/img/*.png
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "docs: refresh app screenshots (automated capture)"
          # A commit can land on this branch while the capture runs (it takes
          # ~8 minutes). Rebase rather than lose the screenshots to a race.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
