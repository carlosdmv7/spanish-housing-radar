name: dbt docs

# Publishes the dbt documentation site (lineage graph, model/column docs, tests)
# to GitHub Pages: https://carlosdmv7.github.io/spanish-housing-radar/
on:
  push:
    branches: [main]
    paths: ["transform/**", ".github/workflows/dbt_docs.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    name: Generate dbt docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transform
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv resolves from the lockfile; --no-dev skips lint/test tools (not needed
      # to compile docs). Runs from transform/, uv finds the root project + .venv.
      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # transform/profiles.yml is git-ignored (it held a local token), and this
      # step still pointed at it: every docs build failed from 2026-07-24 until
      # this fix, and the published site sat on the July 19 lineage. Same
      # approach as ci.yml — a profile in the runner's temp dir — except the token
      # stays an env_var() reference, so it is never written to disk at all.
      - name: Write prod profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt"
          cat > "$RUNNER_TEMP/dbt/profiles.yml" <<'EOF'
          spanish_housing_radar:
            target: prod
            outputs:
              prod:
                type: duckdb
                path: "md:spanish_housing_radar?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
                threads: 4
          EOF

      - name: dbt deps
        run: uv run dbt deps --profiles-dir "$RUNNER_TEMP/dbt"

      # Reads prod catalog metadata (read-only) so docs reflect the live schemas.
      - name: dbt docs generate
        run: uv run dbt docs generate --target prod --profiles-dir "$RUNNER_TEMP/dbt"
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

      # Only the four files the static docs site needs — never the whole target/
      # (compiled SQL there can embed resolved profile strings).
      - name: Assemble site
        run: |
          mkdir -p ../_site
          cp target/index.html target/manifest.json target/catalog.json ../_site/
          [ -f target/graph_summary.json ] && cp target/graph_summary.json ../_site/ || true

      - name: Check no secrets leaked into the site
        run: |
          if grep -rq "motherduck_token=[^{$]" ../_site --include="*.json" --include="*.html"; then
            echo "::error::Resolved MotherDuck token found in docs artifacts — aborting deploy"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
