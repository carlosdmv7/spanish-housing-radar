name: Daily pipeline

on:
  schedule:
    # 05:00 UTC every day — past Spanish business hours, ahead of a morning check-in
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    name: Extract + dbt build (prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: dbt deps
        run: dbt deps
        working-directory: transform

      # daily_pipeline.py pins DBT_PROFILES_DIR to transform/ itself before
      # invoking dbt, so it isn't needed here.
      - name: Run daily pipeline (extract → dbt build)
        run: python -m orchestration.flows.daily_pipeline
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          SCRAPFLY_ENABLED: "true"
