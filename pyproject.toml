[project]
name = "spanish-housing-radar"
version = "0.1.0"
description = "End-to-end analytics-engineering pipeline that finds undervalued homes across Spain."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Spans two minors on purpose. The app is deployed on Streamlit Community
# Cloud, which picks a Python version per app in its own Advanced settings —
# that choice lives in their dashboard, not in this repo, and it is not read
# from `.python-version` or from here. Community Cloud still defaults to 3.12.
# So pinning the floor at 3.13 would declare this project incompatible with the
# interpreter the live app may well be running, and the deploy's dependency
# install would fail with nothing in this repo to explain why.
#
# Widening instead of stepping up gets 3.13 everywhere the repo actually
# controls the interpreter — local dev, Docker, CI — while leaving the deploy
# free to be on either. Verified on both: 115 tests pass and `dbt build` is
# PASS=165 on 3.12 and on 3.13 alike.
requires-python = ">=3.12,<3.14"
dependencies = [
    # ── Core data stack ──────────────────────────────────────────────────────
    "duckdb==1.5.2",          # MotherDuck requires >= 1.5.2
    "dbt-duckdb==1.10.1",
    "dbt-core==1.9.5",
    # ── Streamlit app ────────────────────────────────────────────────────────
    # streamlit >= 1.45 for the native theme keys the brand tokens rely on
    # (linkColor, borderColor, baseRadius) — see .streamlit/config.toml. Pinned
    # to 1.60 so no brand styling has to fall back to CSS injection.
    "streamlit==1.60.0",
    "pydeck==0.9.1",
    # Charts are Altair only (declarative theming from the brand tokens);
    # pydeck stays for the map. Plotly was removed — see docs/adr.
    "altair==5.5.0",
    "pandas==2.2.3",
    # ── Extraction ───────────────────────────────────────────────────────────
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "pydantic==2.10.6",
    "typer==0.13.1",          # pinned <0.14 — prefect==3.1.10 requires typer<0.14.0
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    # ── Scrapfly anti-bot SDK ────────────────────────────────────────────────
    "scrapfly-sdk==0.10.3",
    # ── Orchestration ────────────────────────────────────────────────────────
    "prefect==3.1.10",
]

[dependency-groups]
dev = [
    # No black. Ruff already lints this project and ships a formatter that is a
    # drop-in for it, so carrying both meant two tools with independent opinions
    # about the same files and a `make format` that could undo what `make lint`
    # had just approved. `ruff format` is the one tool now.
    "ruff==0.9.9",
    "pytest==8.3.5",
    "pytest-mock==3.14.0",
]

# This is an application (a collection of runnable packages: extraction, app,
# orchestration, shared), not a distributable library — uv installs only the
# dependencies, never the project itself.
[tool.uv]
package = false

# ══════════════════════════════════════════════════════════════════════════════
# Ruff — lint + format (was ruff.toml)
# ══════════════════════════════════════════════════════════════════════════════
[tool.ruff]
# The LOWEST version this project supports, not the newest and not the one on
# this machine. Ruff uses it to decide which syntax it may suggest, so setting
# it to py313 while requires-python still allows 3.12 would let ruff propose
# rewrites that crash on the interpreter Streamlit Cloud might be running. It
# said py311 while the floor was 3.12 — wrong in the harmless direction, but
# wrong.
target-version = "py312"
line-length = 100
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "data",
    "logs",
    "transform/target",
    "transform/dbt_packages",
]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I isort · B bugbear · UP pyupgrade
# SIM simplify · C4 comprehensions · ARG unused args · PTH pathlib · PL pylint
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ARG", "PTH", "PL"]
ignore = [
    "E501",     # long exception messages / SQL strings
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "PLR2004",  # magic values in scraper parsing logic
    "B027",     # abstract methods with ellipsis
    "ARG002",   # unused args in abstract/interface methods
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]            # scripts may print
"transform/**/*.py" = ["ALL"]        # dbt generated/helper files stay flexible
"__init__.py" = ["F401"]            # init files often only re-export

[tool.ruff.lint.isort]
known-first-party = ["extraction", "app", "shared"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ══════════════════════════════════════════════════════════════════════════════
# Pytest
# ══════════════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
pythonpath = ["."]
# extraction/, app/ and orchestration/ each hold a package literally named
# `tests`. Under pytest's default "prepend" import mode all three claim the
# top-level module name `tests`, so the first one imported wins and the rest
# die with `ModuleNotFoundError: No module named 'tests.test_...'` — which is
# why a bare `pytest` at the repo root failed while CI stayed green by running
# two separate invocations. CONTRIBUTING tells contributors to run the bare
# command, so the gate they were told to use was the one that did not work.
#
# importlib mode imports each test module by its file path instead of by a
# top-level name, so same-named packages no longer collide and one invocation
# covers the whole repo.
addopts = "--import-mode=importlib"
