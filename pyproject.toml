[project]
name = "spanish-housing-radar"
version = "0.1.0"
description = "End-to-end analytics-engineering pipeline that finds undervalued homes across Spain."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── Core data stack ──────────────────────────────────────────────────────
    "duckdb==1.5.2",          # MotherDuck requires >= 1.5.2
    "dbt-duckdb==1.10.1",
    "dbt-core==1.9.5",
    # ── Streamlit app ────────────────────────────────────────────────────────
    "streamlit==1.44.1",
    "pydeck==0.9.1",
    "plotly==5.24.1",
    "pandas==2.2.3",
    # ── Extraction ───────────────────────────────────────────────────────────
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "pydantic==2.10.6",
    "typer==0.13.1",          # pinned <0.14 — prefect==3.1.10 requires typer<0.14.0
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    # ── Scrapfly anti-bot SDK ────────────────────────────────────────────────
    "scrapfly-sdk==0.10.3",
    # ── Orchestration ────────────────────────────────────────────────────────
    "prefect==3.1.10",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "ruff==0.9.9",
    "pytest==8.3.5",
    "pytest-mock==3.14.0",
]

# This is an application (a collection of runnable packages: extraction, app,
# orchestration, shared), not a distributable library — uv installs only the
# dependencies, never the project itself.
[tool.uv]
package = false

# ══════════════════════════════════════════════════════════════════════════════
# Ruff — lint + format (was ruff.toml)
# ══════════════════════════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "data",
    "logs",
    "transform/target",
    "transform/dbt_packages",
]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I isort · B bugbear · UP pyupgrade
# SIM simplify · C4 comprehensions · ARG unused args · PTH pathlib · PL pylint
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ARG", "PTH", "PL"]
ignore = [
    "E501",     # long exception messages / SQL strings
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "PLR2004",  # magic values in scraper parsing logic
    "B027",     # abstract methods with ellipsis
    "ARG002",   # unused args in abstract/interface methods
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]            # scripts may print
"transform/**/*.py" = ["ALL"]        # dbt generated/helper files stay flexible
"__init__.py" = ["F401"]            # init files often only re-export

[tool.ruff.lint.isort]
known-first-party = ["extraction", "app", "shared"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ══════════════════════════════════════════════════════════════════════════════
# Pytest
# ══════════════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
pythonpath = ["."]
